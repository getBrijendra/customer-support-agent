[project]
name = "support-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.7.7",
    "langchain-google-genai>=4.4.3",
    "langgraph>=1.2.20",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "unit: fast tests with no Postgres (SQLite allowed only where noted)",
    "integration: tests against a real Postgres database (local Supabase / CI)",
    "live: opt-in smoke test against the real Gemini API (needs GOOGLE_API_KEY)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["supabase", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
